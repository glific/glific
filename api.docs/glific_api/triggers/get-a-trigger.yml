info:
  name: Get a trigger
  type: graphql
  seq: 2

graphql:
  method: POST
  url: "{{api_url}}"
  body:
    query: |-
      query trigger($id: ID!) {
        trigger(id: $id) {
          trigger {
            id
            name
            startAt
            nextTriggerAt
            endDate
            isActive
            isRepeating
            frequency
            days
            hours
            groupType
            groups
            flow {
              id
              name
            }
            roles {
              id
              label
            }
          }
          errors {
            key
            message
          }
        }
      }
    variables: |-
      {
        "id": "5"
      }
  auth: inherit

docs: |
  Returns one trigger by ID, with its collections' labels in `groups`.

  **Role:** manager

  ## Arguments

  | Argument | Type  | Required | Description            |
  | -------- | ----- | -------- | ---------------------- |
  | `id`     | `ID!` | Yes      | The trigger to return. |

  ## Example response

  ```json
  {
    "data": {
      "trigger": {
        "trigger": {
          "id": "5",
          "name": "Help Workflow_17/11/2026_6:45PM",
          "startAt": "2026-11-17T13:15:00Z",
          "nextTriggerAt": "2026-11-17T13:15:00Z",
          "endDate": "2026-12-31",
          "isActive": true,
          "isRepeating": true,
          "frequency": "weekly",
          "days": [2, 4],
          "hours": [],
          "groupType": "WABA",
          "groups": ["Optin contacts"],
          "flow": { "id": "3", "name": "Help Workflow" },
          "roles": []
        },
        "errors": null
      }
    }
  }
  ```

  ## Errors

  - The trigger does not exist in the organization: `errors` is
    `[{ "key": "Elixir.Glific.Triggers.Trigger", "message": "Resource not found" }]` and
    `trigger` is `null`.
  - A user without the manager role gets a top-level `Unauthorized` error.
