info:
  name: Create a trigger
  type: graphql
  seq: 4

graphql:
  method: POST
  url: "{{api_url}}"
  body:
    query: |-
      mutation createTrigger($input: TriggerInput!) {
        createTrigger(input: $input) {
          trigger {
            id
            name
            startAt
            nextTriggerAt
            endDate
            isActive
            isRepeating
            frequency
            days
            hours
            groupType
            groups
            flow {
              id
              name
            }
          }
          errors {
            key
            message
          }
        }
      }
    variables: |-
      {
        "input": {
          "flowId": "3",
          "groupIds": [1],
          "groupType": "WABA",
          "startDate": "2026-11-17",
          "startTime": "13:15:00",
          "endDate": "2026-12-31",
          "isActive": true,
          "isRepeating": true,
          "frequency": ["weekly"],
          "days": [2, 4]
        }
      }
  auth: inherit

docs: |
  Schedules a flow to start for one or more collections. The trigger's name is generated from
  the flow's name and the start time in the organization's timezone. Call **Validate a
  trigger** first to warn the user if the flow doesn't open with a WhatsApp template.

  **Role:** manager

  ## Arguments

  | Argument | Type            | Required | Description            |
  | -------- | --------------- | -------- | ---------------------- |
  | `input`  | `TriggerInput!` | Yes      | The trigger to create. |

  ### `TriggerInput`

  | Field           | Type       | Required | Description                                                                  |
  | --------------- | ---------- | -------- | ---------------------------------------------------------------------------- |
  | `flowId`        | `ID`       | Yes      | The flow to start. It needs a published revision by the time the trigger runs. |
  | `startDate`     | `Date`     | Yes      | Date of the first run, in UTC.                                               |
  | `startTime`     | `Time`     | Yes      | Time of the first run, in UTC, such as `13:15:00`.                           |
  | `groupIds`      | `[Int]`    | No       | Collections to start the flow for. Defaults to none.                        |
  | `groupType`     | `String`   | No       | `WABA` (default): contacts in the collections. `WA`: the WhatsApp groups in the collections. |
  | `frequency`     | `[String]` | No       | One of `none`, `hourly`, `daily`, `weekly`, `monthly`, as a one-item list.   |
  | `days`          | `[Int]`    | No       | Required for `weekly` (1–7, Monday is 1) and `monthly` (1–31).               |
  | `hours`         | `[Int]`    | No       | Required for `hourly` (0–23).                                                |
  | `isRepeating`   | `Boolean`  | No       | Defaults to `false`: run once, then deactivate.                             |
  | `endDate`       | `Date`     | No       | Last date a repeating trigger may run before. Give it for every repeating trigger: the scheduler compares against it. |
  | `isActive`      | `Boolean`  | No       | Defaults to `true`. Inactive triggers don't run.                            |
  | `startAt`       | `DateTime` | No       | Overrides the start computed from `startDate` and `startTime`. Those two are still required. |
  | `addRoleIds`    | `[ID]`     | No       | Access roles that may see the trigger, for role-based access control.       |
  | `deleteRoleIds` | `[ID]`     | No       | Access roles to remove. Only used together with `addRoleIds`.                |

  For `weekly` and `monthly`, `nextTriggerAt` is the first matching day on or after the start
  date; for the other frequencies it is the start time.

  ## Example response

  ```json
  {
    "data": {
      "createTrigger": {
        "trigger": {
          "id": "5",
          "name": "Help Workflow_17/11/2026_6:45PM",
          "startAt": "2026-11-17T13:15:00Z",
          "nextTriggerAt": "2026-11-17T13:15:00Z",
          "endDate": "2026-12-31",
          "isActive": true,
          "isRepeating": true,
          "frequency": "weekly",
          "days": [2, 4],
          "hours": [],
          "groupType": "WABA",
          "groups": ["Optin contacts"],
          "flow": { "id": "3", "name": "Help Workflow" }
        },
        "errors": null
      }
    }
  }
  ```

  ## Errors

  Validation failures come back in `errors` with `trigger` set to `null`:

  - The start is not in the future:
    `{ "key": "start_at", "message": "Start_at: Trigger start_at should always be greater than current time" }`.
  - `weekly` or `monthly` without valid `days`:
    `{ "key": "frequency", "message": "Frequency: Cannot create Trigger with invalid days" }`.
  - `hourly` without valid `hours`:
    `{ "key": "frequency", "message": "Frequency: Cannot create Trigger with invalid hours" }`.
  - `flowId` is a web flow:
    `{ "key": "flow_id", "message": "Flow_id: Triggers cannot start a web flow, because a web contact can only be reached while their chat window is open" }`.

  Leaving out `flowId`, `startDate` or `startTime` gives a top-level error, `Something unexpected has
  happened, please reach out to Glific team over discord to get this resolved`. A user without
  the manager role gets a top-level `Unauthorized` error.
