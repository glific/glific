info:
  name: Get a credential
  type: graphql
  seq: 1

graphql:
  method: POST
  url: "{{api_url}}"
  body:
    query: |-
      query credential($shortcode: String!) {
        credential(shortcode: $shortcode) {
          credential {
            id
            keys
            secrets
            isActive
            insertedAt
            updatedAt
            provider {
              id
              name
              shortcode
            }
          }
          errors {
            key
            message
          }
        }
      }
    variables: |-
      {
        "shortcode": "google_cloud_storage"
      }
  auth: inherit

docs: |
  Returns the logged-in user's organization's credential for a provider, including its secrets.

  **Role:** admin

  ## Arguments

  | Argument    | Type      | Required | Description                                                 |
  | ----------- | --------- | -------- | ----------------------------------------------------------- |
  | `shortcode` | `String!` | Yes      | The provider's shortcode, such as `gupshup` or `bigquery`.  |

  ## Example response

  `keys` and `secrets` are JSON-encoded strings.

  ```json
  {
    "data": {
      "credential": {
        "credential": {
          "id": "4",
          "keys": "{}",
          "secrets": "{\"bucket\":\"sample-ngo-media\",\"service_account\":\"{...}\"}",
          "isActive": true,
          "insertedAt": "2026-10-01T10:00:00Z",
          "updatedAt": "2026-11-02T09:41:12Z",
          "provider": {
            "id": "3",
            "name": "Google Cloud Storage",
            "shortcode": "google_cloud_storage"
          }
        },
        "errors": null
      }
    }
  }
  ```

  ## Errors

  - No provider has that shortcode:
    `{ "key": "shortcode", "message": "Invalid provider shortcode." }`.
  - The organization has no credential for it: `errors` is
    `[{ "key": "Elixir.Glific.Partners.Credential", "message": "Resource not found" }]`.
  - A user without the admin role gets a top-level `Unauthorized` error.
