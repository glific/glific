info:
  name: Create a credential
  type: graphql
  seq: 2

graphql:
  method: POST
  url: "{{api_url}}"
  body:
    query: |-
      mutation createCredential($input: CredentialInput!) {
        createCredential(input: $input) {
          credential {
            id
            keys
            secrets
            isActive
            provider {
              shortcode
            }
          }
          errors {
            key
            message
          }
        }
      }
    variables: |-
      {
        "input": {
          "shortcode": "dialogflow",
          "keys": "{}",
          "secrets": "{\"project_id\":\"sample-project\",\"project_email\":\"bot@sample-project.example.com\",\"service_account\":\"{\\\"type\\\":\\\"service_account\\\",\\\"private_key\\\":\\\"xxx\\\"}\"}",
          "isActive": true
        }
      }
  auth: inherit

docs: |
  Stores the logged-in user's organization's keys and secrets for a provider and clears the
  organization's cache. It does not check the values against the service; the checks run on
  **Update a credential**.

  For `bigquery`, `secrets.service_account` must be a service account JSON string that passes a
  BigQuery dry run before anything is saved. For an active `web_channel` credential, a signing
  secret is generated.

  **Role:** admin

  ## Arguments

  | Argument | Type               | Required | Description               |
  | -------- | ------------------ | -------- | ------------------------- |
  | `input`  | `CredentialInput!` | Yes      | The credential to create. |

  ### `CredentialInput`

  | Field       | Type      | Required | Description                                                          |
  | ----------- | --------- | -------- | -------------------------------------------------------------------- |
  | `shortcode` | `String`  | Yes      | The provider's shortcode. Ignored by **Update a credential**.        |
  | `keys`      | `Json`    | No       | Non-secret values, as a JSON-encoded object.                         |
  | `secrets`   | `Json`    | No       | Secret values, as a JSON-encoded object. The fields depend on the provider; see its `secrets` in **Providers**. |
  | `isActive`  | `Boolean` | No       | Whether the organization uses this credential.                       |

  ## Example response

  ```json
  {
    "data": {
      "createCredential": {
        "credential": {
          "id": "7",
          "keys": "{}",
          "secrets": "{\"project_email\":\"bot@sample-project.example.com\",\"project_id\":\"sample-project\",\"service_account\":\"{\\\"type\\\":\\\"service_account\\\",\\\"private_key\\\":\\\"xxx\\\"}\"}",
          "isActive": true,
          "provider": { "shortcode": "dialogflow" }
        },
        "errors": null
      }
    }
  }
  ```

  ## Errors

  - No provider has that shortcode:
    `{ "key": "shortcode", "message": "Invalid provider shortcode: <shortcode>." }`.
  - The organization already has a credential for that provider:
    `{ "key": "provider_id", "message": "Provider_id: has already been taken" }`.
  - A `bigquery` service account that is missing or fails validation returns a top-level error
    with the reason, such as `Invalid service account JSON`.
  - A user without the admin role gets a top-level `Unauthorized` error.
