request:
  auth: inherit

docs:
  content: |-
    A credential holds an organization's keys and secrets for one **Provider**, such as its
    Gupshup app, BigQuery service account or Google Cloud Storage bucket. An organization has at
    most one credential per provider, and credentials are looked up by the provider's
    `shortcode`.

    Saving a credential clears the organization's cache. Updating one also checks it against the
    service and runs that service's setup, such as syncing the BigQuery schema or applying the
    Gupshup app settings. A credential that fails the check returns an error.

    All credential operations need the admin role and act on the logged-in user's organization.
  type: text/markdown
