info:
  name: Subscribe to received simulator messages
  type: graphql
  seq: 17

graphql:
  method: POST
  url: "{{api_url}}"
  body:
    query: |-
      subscription receivedSimulatorMessage($organizationId: ID!) {
        receivedSimulatorMessage(organizationId: $organizationId) {
          id
          body
          type
          flow
          status
          bspStatus
          messageNumber
          insertedAt
          contact {
            id
            name
            phone
          }
          media {
            id
            url
          }
        }
      }
    variables: |-
      {
        "organizationId": "1"
      }
  auth: inherit

docs: |
  Like **Subscribe to received messages**, but only for messages from the organization's
  simulator contacts. The flow editor's simulator uses it. These messages are also pushed to
  `receivedMessage`.

  **Role:** any logged-in user of the organization. The subscription has no role check; it only
  checks that `organizationId` is the user's own organization.

  ## Arguments

  | Argument         | Type  | Required | Description                                  |
  | ---------------- | ----- | -------- | -------------------------------------------- |
  | `organizationId` | `ID!` | Yes      | The logged-in user's organization.           |

  The pushed payload is a `Message`; select any of its fields.

  ## Example response

  Each event is pushed as:

  ```json
  {
    "data": {
      "receivedSimulatorMessage": {
        "id": "1060",
        "body": "hi",
        "type": "TEXT",
        "flow": "INBOUND",
        "status": "received",
        "bspStatus": "DELIVERED",
        "messageNumber": 3,
        "insertedAt": "2026-11-16T09:30:12Z",
        "contact": { "id": "8", "name": "Chrissy Cron", "phone": "910000000001" },
        "media": null
      }
    }
  }
  ```

  ## Errors

  An `organizationId` other than the user's own organization is rejected with the error
  `Auth Credentials mismatch`.
