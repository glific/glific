info:
  name: Subscribe to sent messages
  type: graphql
  seq: 16

graphql:
  method: POST
  url: "{{api_url}}"
  body:
    query: |-
      subscription sentMessage($organizationId: ID!) {
        sentMessage(organizationId: $organizationId) {
          id
          body
          type
          flow
          status
          bspStatus
          messageNumber
          insertedAt
          contact {
            id
            name
            phone
          }
          media {
            id
            url
          }
        }
      }
    variables: |-
      {
        "organizationId": "1"
      }
  auth: inherit

docs: |
  Pushes each outbound message once it has been handed to the BSP (or the web channel). Messages
  sent by a collection broadcast are not pushed individually; see **Subscribe to sent collection
  messages**.

  **Role:** any logged-in user of the organization. The subscription has no role check; it only
  checks that `organizationId` is the user's own organization.

  ## Arguments

  | Argument         | Type  | Required | Description                                  |
  | ---------------- | ----- | -------- | -------------------------------------------- |
  | `organizationId` | `ID!` | Yes      | The logged-in user's organization.           |

  The pushed payload is a `Message`; select any of its fields.

  ## Example response

  Each event is pushed as:

  ```json
  {
    "data": {
      "sentMessage": {
        "id": "1060",
        "body": "Thanks for writing in. A volunteer will call you today.",
        "type": "TEXT",
        "flow": "OUTBOUND",
        "status": "enqueued",
        "bspStatus": null,
        "messageNumber": 15,
        "insertedAt": "2026-11-16T09:30:12Z",
        "contact": { "id": "8", "name": "Chrissy Cron", "phone": "910000000001" },
        "media": null
      }
    }
  }
  ```

  ## Errors

  An `organizationId` other than the user's own organization is rejected with the error
  `Auth Credentials mismatch`.
