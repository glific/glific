info:
  name: Count groups
  type: graphql
  seq: 3

graphql:
  method: POST
  url: "{{api_url}}"
  body:
    query: |-
      query countGroups($filter: GroupFilter) {
        countGroups(filter: $filter)
      }
    variables: |-
      {
        "filter": {
          "groupType": "WABA"
        }
      }
  auth: inherit

docs: |
  Counts the organization's groups (collections) that match a filter. Use it with **List
  groups** to build pagination.

  **Role:** staff. A restricted staff user only counts the groups they belong to.

  ## Arguments

  | Argument | Type          | Required | Description                                                  |
  | -------- | ------------- | -------- | ------------------------------------------------------------ |
  | `filter` | `GroupFilter` | No       | Same fields as in **List groups**. Without it, counts all groups. |

  ## Example response

  ```json
  {
    "data": {
      "countGroups": 11
    }
  }
  ```

  ## Errors

  A user without the staff role gets a top-level `Unauthorized` error.
