info:
  name: Count message media
  type: graphql
  seq: 3

graphql:
  method: POST
  url: "{{api_url}}"
  body:
    query: |-
      query countMessagesMedia {
        countMessagesMedia
      }
  auth: inherit

docs: |
  Counts the organization's message media. Takes no arguments.

  **Role:** staff

  ## Example response

  ```json
  {
    "data": {
      "countMessagesMedia": 418
    }
  }
  ```

  ## Errors

  A user without the staff role gets a top-level `Unauthorized` error.
