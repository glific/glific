info:
  name: Get a flow
  type: graphql
  seq: 2

graphql:
  method: POST
  url: "{{api_url}}"
  body:
    query: |-
      query flow($id: ID!) {
        flow(id: $id) {
          flow {
            id
            uuid
            name
            description
            keywords
            ignoreKeywords
            isActive
            isBackground
            isPinned
            isTemplate
            skipValidation
            channel
            flowType
            versionNumber
            insertedAt
            updatedAt
            tag {
              id
              label
            }
            roles {
              id
              label
            }
          }
          errors {
            key
            message
          }
        }
      }
    variables: |-
      {
        "id": "3"
      }
  auth: inherit

docs: |
  Returns one flow by ID. It returns the flow's settings, not its definition: the editor
  loads that from **Flow Editor › Get a flow definition**. `lastPublishedAt` and
  `lastChangedAt` are only filled in by **List flows**; here they are `null`.

  **Role:** staff

  ## Arguments

  | Argument | Type  | Required | Description         |
  | -------- | ----- | -------- | ------------------- |
  | `id`     | `ID!` | Yes      | The flow to return. |

  ## Example response

  ```json
  {
    "data": {
      "flow": {
        "flow": {
          "id": "3",
          "uuid": "3fa22108-f464-41e5-81d9-d8a298854429",
          "name": "Help Workflow",
          "description": null,
          "keywords": ["help", "मदद"],
          "ignoreKeywords": true,
          "isActive": true,
          "isBackground": false,
          "isPinned": false,
          "isTemplate": false,
          "skipValidation": false,
          "channel": "WHATSAPP",
          "flowType": "MESSAGE",
          "versionNumber": "13.1.0",
          "insertedAt": "2026-10-01T05:30:00Z",
          "updatedAt": "2026-11-10T07:12:44Z",
          "tag": null,
          "roles": []
        },
        "errors": null
      }
    }
  }
  ```

  ## Errors

  - The flow does not exist in the organization: `errors` is
    `[{ "key": "Elixir.Glific.Flows.Flow", "message": "Resource not found" }]` and `flow` is
    `null`.
  - A user without the staff role gets a top-level `Unauthorized` error.
