info:
  name: Auto-translate a flow
  type: graphql
  seq: 15

graphql:
  method: POST
  url: "{{api_url}}"
  body:
    query: |-
      mutation inlineFlowLocalization($id: ID!) {
        inlineFlowLocalization(id: $id) {
          success
          errors {
            key
            message
          }
        }
      }
    variables: |-
      {
        "id": "3"
      }
  auth: inherit

docs: |
  Machine-translates every untranslated "send message" text in the flow into the
  organization's other languages and saves the result as a new draft revision, in one step.
  It is **Export a flow's translations** with `addTranslation: true` followed by **Import a
  flow's translations**, without a chance to review. Publish the flow to make the
  translations live.

  If any string fails to translate, nothing is saved.

  **Role:** manager

  ## Arguments

  | Argument | Type  | Required | Description            |
  | -------- | ----- | -------- | ---------------------- |
  | `id`     | `ID!` | Yes      | The flow to translate. |

  ## Example response

  ```json
  {
    "data": {
      "inlineFlowLocalization": {
        "success": true,
        "errors": null
      }
    }
  }
  ```

  ## Errors

  - A translation failed: a top-level error with the first failure's reason, such as
    `Translation request timed out`.
  - The flow does not exist in the organization: a top-level error, `Something unexpected has
    happened, please reach out to Glific team over discord to get this resolved`.
  - A user without the manager role gets a top-level `Unauthorized` error.
