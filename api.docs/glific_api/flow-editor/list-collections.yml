info:
  name: List collections
  type: http
  seq: 8

http:
  method: GET
  url: "{{base_url}}/flow-editor/groups"
  auth: inherit

docs: |
  Lists the organization's collections (groups) for the editor's "add to collection" and
  "remove from collection" actions. With role-based access control on, users without the
  Admin, Manager or Staff access role only get the collections assigned to their roles.

  **Auth:** any logged-in user.

  ## Request body

  None.

  ## Example response

  `200`. `uuid` holds the collection's ID as a string.

  ```json
  {
    "results": [
      { "uuid": "1", "name": "Optin contacts", "type": "group" },
      { "uuid": "2", "name": "Default Collection", "type": "group" }
    ]
  }
  ```

  ## Errors

  - `401`: missing or invalid access token.
