info:
  name: List WhatsApp HSM categories
  type: graphql
  seq: 14

graphql:
  method: POST
  url: "{{api_url}}"
  body:
    query: |-
      query whatsappHsmCategories {
        whatsappHsmCategories
      }
    variables: |-
      {}
  auth: inherit

docs: |
  Returns the categories an HSM template can be submitted under. The list is fixed in Glific.

  **Role:** manager

  ## Arguments

  None.

  ## Example response

  ```json
  {
    "data": {
      "whatsappHsmCategories": ["UTILITY", "MARKETING"]
    }
  }
  ```

  **Create a session template** also accepts `AUTHENTICATION`, for one-time code templates,
  which this list leaves out.

  ## Errors

  A user without the manager role gets a top-level `Unauthorized` error.
