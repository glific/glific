info:
  name: Count interactive templates
  type: graphql
  seq: 3

graphql:
  method: POST
  url: "{{api_url}}"
  body:
    query: |-
      query countInteractiveTemplates($filter: InteractiveTemplateFilter) {
        countInteractiveTemplates(filter: $filter)
      }
    variables: |-
      {
        "filter": {
          "type": "LIST"
        }
      }
  auth: inherit

docs: |
  Counts the organization's interactive templates that match a filter. Use it with **List
  interactive templates** to build pagination.

  **Role:** manager

  ## Arguments

  | Argument | Type                        | Required | Description                                                          |
  | -------- | --------------------------- | -------- | -------------------------------------------------------------------- |
  | `filter` | `InteractiveTemplateFilter` | No       | Same fields as in **List interactive templates**. Without it, counts all. |

  ## Example response

  ```json
  {
    "data": {
      "countInteractiveTemplates": 1
    }
  }
  ```

  ## Errors

  A user without the manager role gets a top-level `Unauthorized` error.
