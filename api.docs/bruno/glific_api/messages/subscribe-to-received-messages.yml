info:
  name: Subscribe to received messages
  type: graphql
  seq: 15

graphql:
  method: POST
  url: "{{api_url}}"
  body:
    query: |-
      subscription receivedMessage($organizationId: ID!) {
        receivedMessage(organizationId: $organizationId) {
          id
          body
          type
          flow
          status
          bspStatus
          messageNumber
          insertedAt
          contact {
            id
            name
            phone
          }
          media {
            id
            url
          }
        }
      }
    variables: |-
      {
        "organizationId": "1"
      }
  auth: inherit

docs: |
  Pushes each inbound message from a contact as soon as Glific stores it, whether it came from
  the BSP (WhatsApp) or the web channel. The inbox uses it to show new messages live.

  **Role:** any logged-in user of the organization. The subscription has no role check; it only
  checks that `organizationId` is the user's own organization.

  ## Arguments

  | Argument         | Type  | Required | Description                                  |
  | ---------------- | ----- | -------- | -------------------------------------------- |
  | `organizationId` | `ID!` | Yes      | The logged-in user's organization.           |

  The pushed payload is a `Message`; select any of its fields.

  ## Example response

  Each event is pushed as:

  ```json
  {
    "data": {
      "receivedMessage": {
        "id": "1060",
        "body": "Hi, I want to know about the next session",
        "type": "TEXT",
        "flow": "INBOUND",
        "status": "received",
        "bspStatus": "DELIVERED",
        "messageNumber": 14,
        "insertedAt": "2026-11-16T09:30:12Z",
        "contact": { "id": "8", "name": "Chrissy Cron", "phone": "910000000001" },
        "media": null
      }
    }
  }
  ```

  ## Errors

  An `organizationId` other than the user's own organization is rejected with the error
  `Auth Credentials mismatch`.
