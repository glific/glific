info:
  name: Reset a password
  type: http
  seq: 6

http:
  method: POST
  url: "{{api_url}}/v1/registration/reset-password"
  body:
    type: json
    data: |-
      {
        "user": {
          "phone": "910000000004",
          "password": "Secret1234!",
          "otp": "321721"
        }
      }

docs: |
  Sets a new password using a code from **Send an OTP** (`registration: "false"`). Ends
  every existing session of the user, then logs them in with the new password.

  ## Request body

  | Field           | Type   | Required | Description                   |
  | --------------- | ------ | -------- | ----------------------------- |
  | `user.phone`    | String | Yes      | The user's phone number.      |
  | `user.password` | String | Yes      | The new password.             |
  | `user.otp`      | String | Yes      | The code from WhatsApp.       |

  ## Example response

  ```json
  {
    "data": {
      "access_token": "SFMyNTY.OWQ0YzBkOWEtNWYyOS00ZTAyLWI2YjMtZTNkM2Q0OGJmNmU5.Hk2b7JrYcU",
      "renewal_token": "SFMyNTY.MmE1ZTM4YmMtNjE5Ny00ZTZiLTk2ZGEtYmI4MmU0ZjcwMmNm.Pn0wBsx1aE",
      "token_expiry_time": "2026-11-16T10:00:00.000000Z"
    }
  }
  ```

  ## Errors

  `500` when the OTP is wrong or expired or the new password is rejected:
  `{ "error": { "status": 500, "message": "Couldn't update user password" } }`.
