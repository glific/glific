info:
  name: Update a credential
  type: graphql
  seq: 3

graphql:
  method: POST
  url: "{{api_url}}"
  body:
    query: |-
      mutation updateCredential($id: ID!, $input: CredentialInput) {
        updateCredential(id: $id, input: $input) {
          credential {
            id
            keys
            secrets
            isActive
            provider {
              shortcode
            }
          }
          errors {
            key
            message
          }
        }
      }
    variables: |-
      {
        "id": "2",
        "input": {
          "secrets": "{\"app_name\":\"SampleNgoApp\",\"api_key\":\"xxx\",\"app_id\":\"00000000-0000-0000-0000-000000000000\"}",
          "isActive": true
        }
      }
  auth: inherit

docs: |
  Changes one of the logged-in user's organization's credentials, then checks it against the
  service and sets the service up. Only the fields given in `input` change, but `secrets`
  replaces the whole object.

  What happens after saving depends on the provider:

  | Provider               | After saving                                                                                         |
  | ---------------------- | ---------------------------------------------------------------------------------------------------- |
  | `gupshup`              | Needs `app_name`, `api_key` and `app_id`. Makes Gupshup the organization's BSP, checks the app with Gupshup, applies the app settings and mails the team. If the app does not match, the secrets are reset to `NA`. |
  | `gupshup_enterprise`   | Makes it the organization's BSP when all four user IDs and passwords are set.                         |
  | `bigquery`             | Validates the service account first, then syncs the BigQuery schema. On failure the credential is disabled. |
  | `google_cloud_storage` | When active, sets up the bucket and enables bucket logs.                                             |
  | `dialogflow`           | Lists the agent's intents to check access.                                                           |
  | `maytapi`              | Queues a sync of WhatsApp groups and contacts and adds a notification.                              |
  | `web_channel`          | When made inactive, closes all open web chat conversations. When active, makes sure a signing secret exists. |

  The credential is saved before these checks run, so a failed check still leaves the new values
  stored, except for BigQuery.

  **Role:** admin

  ## Arguments

  | Argument | Type              | Required | Description                                                   |
  | -------- | ----------------- | -------- | ------------------------------------------------------------- |
  | `id`     | `ID!`             | Yes      | The credential to change. Must belong to the user's organization. |
  | `input`  | `CredentialInput` | No       | Fields to change. See **Create a credential** for the list.    |

  ## Example response

  ```json
  {
    "data": {
      "updateCredential": {
        "credential": {
          "id": "2",
          "keys": "{\"url\":\"https://gupshup.io/\"}",
          "secrets": "{\"api_key\":\"xxx\",\"app_id\":\"00000000-0000-0000-0000-000000000000\",\"app_name\":\"SampleNgoApp\"}",
          "isActive": true,
          "provider": { "shortcode": "gupshup" }
        },
        "errors": null
      }
    }
  }
  ```

  ## Errors

  - The credential does not exist in the organization: `errors` is
    `[{ "key": "Elixir.Glific.Partners.Credential", "message": "Resource not found" }]`.
  - A failed check returns a top-level error with the reason, such as
    `App Name and API Key and App ID can't be empty`, `App Name and/or App ID invalid` or
    `Invalid Credentials`.
  - A user without the admin role gets a top-level `Unauthorized` error.
