info:
  name: Update a trigger
  type: graphql
  seq: 5

graphql:
  method: POST
  url: "{{api_url}}"
  body:
    query: |-
      mutation updateTrigger($id: ID!, $input: TriggerInput!) {
        updateTrigger(id: $id, input: $input) {
          trigger {
            id
            name
            startAt
            nextTriggerAt
            endDate
            isRepeating
            frequency
            days
            hours
            groups
          }
          errors {
            key
            message
          }
        }
      }
    variables: |-
      {
        "id": "5",
        "input": {
          "flowId": "3",
          "groupIds": [1, 2],
          "startDate": "2026-11-18",
          "startTime": "04:30:00",
          "endDate": "2027-01-31",
          "isRepeating": true,
          "frequency": ["daily"]
        }
      }
  auth: inherit

docs: |
  Reschedules or retargets a trigger. Send the whole schedule each time: the start is
  recomputed from `startDate` and `startTime`, and the name, `nextTriggerAt` and last run are
  reset from it, as in **Create a trigger**.

  `isActive` is read-only here: including it, even with the current value, makes the update
  fail.

  **Role:** manager

  ## Arguments

  | Argument | Type            | Required | Description                                                                           |
  | -------- | --------------- | -------- | ------------------------------------------------------------------------------------- |
  | `id`     | `ID!`           | Yes      | The trigger to change.                                                                |
  | `input`  | `TriggerInput!` | Yes      | The new settings. See **Create a trigger** for the fields; `flowId`, `startDate` and `startTime` are required and `isActive` is not allowed. |

  ## Example response

  ```json
  {
    "data": {
      "updateTrigger": {
        "trigger": {
          "id": "5",
          "name": "Help Workflow_18/11/2026_10:00AM",
          "startAt": "2026-11-18T04:30:00Z",
          "nextTriggerAt": "2026-11-18T04:30:00Z",
          "endDate": "2027-01-31",
          "isRepeating": true,
          "frequency": "daily",
          "days": [],
          "hours": [],
          "groups": ["Optin contacts", "Default Collection"]
        },
        "errors": null
      }
    }
  }
  ```

  ## Errors

  Every failure, whatever the cause, returns the same top-level error, with
  `updateTrigger` set to `null`:

  ```json
  { "message": "Trigger start_at should always be greater than current time", "path": ["updateTrigger"] }
  ```

  That includes a start in the past, invalid `days` or `hours`, a trigger that doesn't exist
  in the organization, and `isActive` in the input. Leaving out `flowId`, `startDate` or
  `startTime` gives a top-level `Something unexpected has happened, please reach out to Glific
  team over discord to get this resolved` instead. A user without the manager role gets a
  top-level `Unauthorized` error.
