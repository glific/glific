query AssistantConfigVersions {
  assistantConfigVersions {
    id
    assistantId
    kaapiUuid
    majorVersion
    minorVersion
    assistantName
    description
    prompt
    provider
    model
    settings
    inputGuardrails
    outputGuardrails
    status
    failureReason
    insertedAt
    updatedAt
  }
}
