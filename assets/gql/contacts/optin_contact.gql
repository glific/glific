mutation optinContact($phone: String, $name: String, $channel: MessageChannelEnum, $identifier: String) {
  optinContact(phone: $phone, name: $name, channel: $channel, identifier: $identifier) {
    contact {
      id
      name
      phone
      bspStatus
      optinTime
    }
    errors {
      key
      message
    }
  }
}
