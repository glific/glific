query GetGoldenQa($id: ID!, $includeSignedUrl: Boolean) {
  goldenQa(id: $id, includeSignedUrl: $includeSignedUrl) {
    goldenQa {
      id
      name
      datasetId
      duplicationFactor
      fileName
      signedUrl
      totalItems
      insertedAt
      updatedAt
    }
    errors {
      message
    }
  }
}
